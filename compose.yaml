# Local development on the production versions: PHP 8.5 and MySQL 9.7 LTS.
# To just look at the store, run bin/preview (it does every step below). By hand:
#   docker compose up -d
#   docker compose exec app php artisan migrate:fresh --seed
#   docker compose exec app php artisan test
# JUDE_PORT and JUDE_DB_PORT change the ports on this computer (8000 and 3307).
services:
  app:
    image: chialab/php:8.5
    working_dir: /app
    volumes: [".:/app"]
    entrypoint: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]
    environment:
      DB_HOST: db
      DB_PORT: 3306
      PHP_CLI_SERVER_WORKERS: 4   # a page loads many images at once
    ports: ["${JUDE_PORT:-8000}:8000"]
    depends_on: [db]
  db:
    image: mysql:9.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jude
      MYSQL_USER: jude
      MYSQL_PASSWORD: secret
    volumes: ["mysql:/var/lib/mysql", "./deploy/mysql/test-db.sql:/docker-entrypoint-initdb.d/test-db.sql:ro"]
    ports: ["${JUDE_DB_PORT:-3307}:3306"]
volumes:
  mysql:
