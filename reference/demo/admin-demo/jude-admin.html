<title>JUDE Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Merriweather:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#fdf6f8; --panel:#ffffff; --sunken:#faeff2; --sunken-2:#f4e0e6;
  --ink:#2e1c22; --ink-soft:#50393f; --muted:#735e64;
  --rose:#a24f68; --rose-strong:#874058; --rose-soft:#f6d5de; --on-rose:#ffffff;
  --plum:#4a2633; --plum-ink:#fdf6f8; --plum-muted:#e9c9d3;
  --line:#8c445924; --line-strong:#8c445945;
  --ok:#2f6b4f; --ok-soft:#dcefe4; --warn:#8a5a12; --warn-soft:#f8ead0;
  --info:#2f4f7a; --info-soft:#dde7f5; --bad:#9b2d3c; --bad-soft:#f7dade;
  --rail:#6e3547; --shadow:0 1px 2px #4a26330f,0 6px 20px #4a263314;
  --scrim:#2e1c2266;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1215; --panel:#26191d; --sunken:#2f1f24; --sunken-2:#3a262d;
  --ink:#f7e9ed; --ink-soft:#e2cbd2; --muted:#b89ca5;
  --rose:#e28aa4; --rose-strong:#f0a3b9; --rose-soft:#4a2633; --on-rose:#2b1218;
  --plum:#140c0f; --plum-ink:#f7e9ed; --plum-muted:#b89ca5;
  --line:#e9b2c21f; --line-strong:#e9b2c240;
  --ok:#8fd1ae; --ok-soft:#1f3a2c; --warn:#e8c07a; --warn-soft:#3d2e14;
  --info:#9fbde6; --info-soft:#1e2c40; --bad:#f09aa6; --bad-soft:#47202a;
  --rail:#c98a9d; --shadow:0 1px 2px #0006,0 6px 20px #0005; --scrim:#000a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1215; --panel:#26191d; --sunken:#2f1f24; --sunken-2:#3a262d;
  --ink:#f7e9ed; --ink-soft:#e2cbd2; --muted:#b89ca5;
  --rose:#e28aa4; --rose-strong:#f0a3b9; --rose-soft:#4a2633; --on-rose:#2b1218;
  --plum:#140c0f; --plum-ink:#f7e9ed; --plum-muted:#b89ca5;
  --line:#e9b2c21f; --line-strong:#e9b2c240;
  --ok:#8fd1ae; --ok-soft:#1f3a2c; --warn:#e8c07a; --warn-soft:#3d2e14;
  --info:#9fbde6; --info-soft:#1e2c40; --bad:#f09aa6; --bad-soft:#47202a;
  --rail:#c98a9d; --shadow:0 1px 2px #0006,0 6px 20px #0005; --scrim:#000a;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:Merriweather,Georgia,serif;font-weight:700;text-wrap:balance;margin:0;color:var(--ink)}
h1{font-size:1.45rem;line-height:1.25} h2{font-size:1.05rem} h3{font-size:.95rem}
.brand{font-family:"Bodoni Moda",Didot,"Times New Roman",serif;font-weight:600;letter-spacing:.18em}
.eyebrow{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
a{color:var(--rose)}

/* banner */
.demo-banner{background:var(--plum);color:var(--plum-ink);font-size:.75rem;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center;justify-content:center;text-align:center}
.demo-banner b{color:var(--plum-muted);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:.66rem}

/* login */
.login{min-height:calc(100dvh - 40px);display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:32px 24px;box-shadow:var(--shadow);display:grid;gap:18px;text-align:center}
.login-card .brand{font-size:2.2rem}
.login-card form{display:grid;gap:12px;text-align:left}

/* shell */
.shell{display:grid;grid-template-columns:1fr;min-height:calc(100dvh - 34px)}
.side{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar .brand{font-size:1.25rem}
.topbar .spacer{flex:1}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--rose-soft);color:var(--rose-strong);display:grid;place-items:center;font-weight:700;font-size:.8rem;border:0;cursor:pointer}
main{padding-block:20px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-content:start;max-width:1080px;width:100%;margin:0 auto}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bottomnav button{background:none;border:0;padding:9px 2px 8px;display:grid;justify-items:center;gap:3px;font-size:.66rem;font-weight:600;color:var(--muted);cursor:pointer}
.bottomnav button[aria-current="page"]{color:var(--rose)}
.bottomnav svg,.side svg{width:21px;height:21px}
@media (min-width:900px){
  .shell{grid-template-columns:236px 1fr}
  .side{display:flex;flex-direction:column;gap:4px;background:var(--plum);color:var(--plum-ink);padding:22px 14px;position:sticky;top:0;height:calc(100dvh - 34px)}
  .side .brand{font-size:1.6rem;padding:4px 12px 2px}
  .side .sub{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--plum-muted);padding:0 12px 18px}
  .side button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--plum-muted);padding:10px 12px;border-radius:10px;font-weight:500;cursor:pointer;text-align:left}
  .side button:hover{background:#ffffff12;color:var(--plum-ink)}
  .side button[aria-current="page"]{background:#ffffff1c;color:var(--plum-ink);font-weight:600}
  .side .foot{margin-top:auto;font-size:.72rem;color:var(--plum-muted);padding:12px}
  .bottomnav,.topbar .brand{display:none}
  main{padding-block:28px 48px}
}

/* generic */
.head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.head > div{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card > h2 + *{margin-top:12px}
.grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.stat{padding:16px}
.stat .v{font-family:Merriweather,Georgia,serif;font-size:1.45rem;font-weight:700;margin-top:4px}
.stat .d{font-size:.72rem;color:var(--ok);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid transparent;padding:10px 18px;font-weight:600;font-size:.85rem;cursor:pointer;white-space:nowrap;min-height:40px}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--rose);color:var(--on-rose)}
.btn-primary:hover{background:var(--rose-strong)}
.btn-ghost{background:var(--panel);border-color:var(--line-strong);color:var(--ink)}
.btn-danger{background:var(--bad-soft);color:var(--bad)}
.btn-sm{padding:6px 12px;min-height:32px;font-size:.78rem}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line-strong);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--ink-soft);flex:none}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn svg{width:18px;height:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.7rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-new{background:var(--rose-soft);color:var(--rose-strong)}
.s-confirmed{background:var(--info-soft);color:var(--info)}
.s-out{background:var(--warn-soft);color:var(--warn)}
.s-delivered{background:var(--ok-soft);color:var(--ok)}
.s-cancelled{background:var(--sunken-2);color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line-strong);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:grid;gap:6px;min-width:0}
.field label,.lbl{font-size:.74rem;font-weight:600;color:var(--ink-soft)}
.input{width:100%;border:1px solid var(--line-strong);background:var(--panel);border-radius:12px;padding:10px 12px;min-height:42px}
.input:focus{outline:2px solid var(--rose);outline-offset:1px;border-color:transparent}
textarea.input{min-height:84px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.row.wrap{flex-wrap:wrap}
.form{display:grid;gap:14px}
.form .cols{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch small{display:block;color:var(--muted);font-size:.72rem}
.toggle{appearance:none;width:44px;height:26px;border-radius:999px;background:var(--sunken-2);position:relative;cursor:pointer;flex:none;transition:background .2s;border:1px solid var(--line-strong)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--panel);box-shadow:0 1px 3px #0003;transition:transform .2s}
.toggle:checked{background:var(--rose);border-color:var(--rose)}
.toggle:checked::after{transform:translateX(18px)}
.list{display:grid}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.click{cursor:pointer}
.thumb{width:48px;height:60px;border-radius:10px;object-fit:cover;background:var(--sunken);flex:none}
.money{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}

/* hero rack preview */
.stage{background:linear-gradient(180deg,var(--sunken),var(--panel));border:1px solid var(--line);border-radius:18px;padding:18px 14px 12px;overflow:hidden}
.stage-copy{display:grid;gap:4px;margin-bottom:12px}
.stage-copy .ht{font-family:Merriweather,Georgia,serif;font-weight:700;font-size:1.1rem}
.rail-wrap{position:relative;padding-top:10px}
.rail{position:absolute;left:4px;right:4px;top:10px;height:6px;border-radius:6px;background:var(--rail)}
.rail::before,.rail::after{content:"";position:absolute;top:0;width:6px;height:150px;background:var(--rail);border-radius:3px;opacity:.35}
.rail::before{left:0}.rail::after{right:0}
.garments{display:flex;justify-content:center;gap:2%;position:relative;min-height:170px;padding:0 10px}
.garment{width:18%;max-width:120px;transform-origin:50% 0;animation:sway 4.5s ease-in-out infinite;margin-top:-4px}
.garment:nth-child(2n){animation-delay:-1.6s}.garment:nth-child(3n){animation-delay:-3s}
.garment img{width:100%;max-width:100%;display:block;filter:drop-shadow(0 6px 8px #4a263326)}
.garment.enter{animation:slidein .6s ease-out, sway 4.5s ease-in-out .6s infinite}
@keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes slidein{from{transform:translateX(-60px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.garment,.garment.enter{animation:none}}
.empty-rail{display:grid;place-items:center;min-height:150px;color:var(--muted);font-size:.8rem}
.rack-item{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.rack-item.off{opacity:.55}
.rack-item img{width:44px;height:64px;object-fit:contain;background:var(--sunken);border-radius:8px;flex:none}
.rack-item .grow{flex:1;min-width:0}
.rack-item .num{font-family:Merriweather,Georgia,serif;font-weight:700;color:var(--muted);width:18px;text-align:center;flex:none}
.rack-item .actions{display:flex;gap:6px;align-items:center;flex:none}
@media (max-width:480px){.rack-item{gap:8px;padding:8px}.rack-item .actions{gap:4px}.rack-item .icon-btn{width:32px;height:32px}.rack-item img{width:36px;height:54px}}

/* product grid */
.pgrid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:640px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1000px){.pgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:grid;box-shadow:var(--shadow)}
.pcard .ph{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--sunken)}
.pcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .ph .tags{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap}
.tag{background:var(--panel);color:var(--ink-soft);font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.off{background:var(--sunken-2);color:var(--muted)}
.pcard .meta{padding:10px 12px 12px;display:grid;gap:2px;min-width:0}
.pcard .meta .n{font-weight:600;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .meta .c{font-size:.72rem;color:var(--muted);text-transform:capitalize}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:16px;animation:up .25s ease-out}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:12px;justify-content:space-between}
.sheet-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:12px calc(4px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-bottom:calc(-18px - env(safe-area-inset-bottom,0px))}
.sheet-foot .left{margin-right:auto}
.photo-edit{display:flex;gap:14px;align-items:center}
.photo-edit img{width:84px;height:105px;object-fit:cover;border-radius:12px;background:var(--sunken)}
.confirm{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;font-weight:600;font-size:.82rem}
.picker{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.picker button{border:2px solid transparent;border-radius:12px;background:var(--sunken);padding:4px;cursor:pointer}
.picker button[aria-pressed="true"]{border-color:var(--rose)}
.picker img{width:100%;aspect-ratio:3/4;object-fit:contain;display:block;max-width:100%}
.upload{border:1.5px dashed var(--line-strong);border-radius:12px;padding:14px;text-align:center;cursor:pointer;color:var(--muted);font-size:.8rem;display:block}
.upload input{display:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.84rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.steps{display:flex;gap:6px;flex-wrap:wrap}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th{text-align:left;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tablewrap{overflow-x:auto}
td .input{min-height:36px;padding:6px 10px;max-width:90px}
.faq{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;background:var(--panel)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:.82rem;z-index:30;box-shadow:var(--shadow);animation:up .2s ease-out;max-width:calc(100% - 32px);text-align:center}
@media (min-width:900px){.toast{bottom:28px}}
.morelist button{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.morelist button:last-child{border-bottom:0}
.morelist svg{width:22px;height:22px;color:var(--rose)}
.morelist .grow{flex:1;min-width:0}
.morelist small{display:block;color:var(--muted);font-size:.74rem}
.bar{height:8px;border-radius:8px;background:var(--sunken-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--rose);border-radius:8px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

function sampleOrders(products){
  const p = (i) => products[i % products.length];
  const people = [
    ['Lina K.','Amman','Khalda'],['Sara M.','Irbid','Huwwara'],['Rana A.','Amman','Sweifieh'],['Dana H.','Zarqa','New Zarqa'],
    ['Noor S.','Amman','Dabouq'],['Hala T.','Salt','Al-Fuhais'],['Maya R.','Madaba','Madaba City Centre'],['Yara B.','Aqaba','Ayla'],
    ['Tala F.','Amman','Abdoun'],['Leen Q.','Jerash','Souf']
  ];
  const st = ['new','new','confirmed','out','delivered','delivered','confirmed','delivered','cancelled','delivered'];
  const when = ['Today, 11:42','Today, 09:15','Yesterday','Yesterday','2 days ago','3 days ago','3 days ago','4 days ago','5 days ago','6 days ago'];
  return people.map(([name,city,area],i) => {
    const items = [{id:p(i*3).id, qty:1}];
    if (i % 3 === 0) items.push({id:p(i*3+7).id, qty:i%2+1});
    return {no: 1048 - i, name, city, area, phone:`07${9-i%3} ${String(1000000 + i*373137).slice(0,3)} ${String(4000 + i*611).slice(0,4)}`, status:st[i], when:when[i], items, note: i===0 ? 'Please call before delivery' : ''};
  });
}

/* ---------- render ---------- */
function render(){
  if (!S.signedIn){ app.innerHTML = vLogin(); return }
  const views = {home:vHome, rack:vRack, products:vProducts, orders:vOrders, more:vMore, content:vContent, delivery:vDelivery, settings:vSettings};
  let html = shell((views[UI.view]||vHome)());
  const sh = UI.sheet;
  if (sh){
    let inner = '';
    if (sh.type==='product') inner = sheetProduct(sh.draft, sh.isNew);
    if (sh.type==='order') inner = sheetOrder(S.orders.find(o=>o.no===sh.no));
    if (sh.type==='rack') inner = sheetRack(sh.draft, sh.i);
    html += `<div class="scrim" data-scrim>${inner}</div>`;
  }
  const y = window.scrollY, sy = document.querySelector('.sheet')?.scrollTop;
  app.innerHTML = html;
  document.body.style.overflow = sh ? 'hidden' : '';
  if (sh && sy) document.querySelector('.sheet').scrollTop = sy;
  window.scrollTo(0,y);
  UI.justAdded = null;
}

app.addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.id==='login'){ S.signedIn = true; save(); render(); return }
  if (e.target.id==='pform'){
    const d = UI.sheet.draft, f = (id)=>document.getElementById(id);
    Object.assign(d, {name:f('pn').value.trim()||'Untitled', cat:f('pc').value, price:+f('pp').value||0, color:f('pcol').value, desc:f('pd').value, pub:f('ppub').checked, stock:f('pstock').checked, featured:f('pfeat').checked});
    if (UI.sheet.isNew) S.products.unshift(d); else Object.assign(byId(d.id), d);
    toast(UI.sheet.isNew ? 'Product added' : 'Product saved'); UI.sheet = null; save(); render(); return;
  }
  if (e.target.id==='rform'){
    const d = UI.sheet.draft; d.name = document.getElementById('rn').value.trim()||'New piece'; d.slug = document.getElementById('rl').value;
    if (UI.sheet.i < 0){ S.rack.push(d); UI.justAdded = d.src+d.name; toast('Hung on the rack') } else { S.rack[UI.sheet.i] = d; toast('Saved') }
    UI.sheet = null; save(); render();
  }
});
app.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id==='pfile' && t.files[0]){ UI.sheet.draft.img = URL.createObjectURL(t.files[0]); document.getElementById('pimg').src = UI.sheet.draft.img }
  if (t.id==='rfile' && t.files[0]){ keepRackForm(); UI.sheet.draft.src = URL.createObjectURL(t.files[0]); render() }
});
function keepRackForm(){ const n=document.getElementById('rn'), l=document.getElementById('rl'); if(n){UI.sheet.draft.name=n.value; UI.sheet.draft.slug=l.value} }
app.addEventListener('input', (e) => {
  if (e.target.id==='q'){ UI.q = e.target.value; const pos = e.target.selectionStart; render(); const q=document.getElementById('q'); q.focus(); q.setSelectionRange(pos,pos) }
});
app.addEventListener('click', (e) => {
  if (e.target.matches('[data-scrim]')){ UI.sheet=null; UI.confirm=false; render(); return }
  const b = e.target.closest('button,[data-order],[data-act],a[data-act]'); if (!b) return;
  const ds = b.dataset;
  if (ds.go){ go(ds.go); return }
  if (ds.cat){ UI.cat = ds.cat; render(); return }
  if (ds.ost){ UI.ostatus = ds.ost; render(); return }
  if (ds.order){ UI.sheet = {type:'order', no:+ds.order}; render(); return }
  if (ds.setstatus){ S.orders.find(o=>o.no===UI.sheet.no).status = ds.setstatus; save(); render(); toast(`Marked as ${SLABEL[ds.setstatus]}`); return }
  if (ds.product){ UI.confirm=false; UI.sheet = {type:'product', draft:{...byId(ds.product)}, isNew:false}; render(); return }
  if (ds.size !== undefined){ b.setAttribute('aria-pressed', b.getAttribute('aria-pressed')==='true'?'false':'true'); return }
  if (ds.pick){ keepRackForm(); UI.sheet.draft.src = ds.pick; render(); return }
  if (ds.rack){
    const i = +ds.i, r = S.rack;
    if (ds.rack==='up' && i>0) [r[i-1],r[i]]=[r[i],r[i-1]];
    if (ds.rack==='down' && i<r.length-1) [r[i+1],r[i]]=[r[i],r[i+1]];
    if (ds.rack==='toggle'){ r[i].show=!r[i].show; toast(r[i].show?'Back on the rail':'Hidden from the rail') }
    if (ds.rack==='edit'){ UI.confirm=false; UI.sheet={type:'rack', draft:{...r[i]}, i}; }
    save(); render(); return;
  }
  if (ds.delfaq){ S.faqs.splice(+ds.delfaq,1); save(); render(); toast('Question removed'); return }
  const a = ds.act;
  if (a) e.preventDefault();
  if (a==='close'){ UI.sheet=null; UI.confirm=false; render() }
  if (a==='askdelete'){ UI.confirm=true; render() }
  if (a==='noconfirm'){ UI.confirm=false; render() }
  if (a==='delproduct'){ S.products = S.products.filter(p=>p.id!==UI.sheet.draft.id); UI.sheet=null; UI.confirm=false; save(); render(); toast('Product deleted') }
  if (a==='delrack'){ S.rack.splice(UI.sheet.i,1); UI.sheet=null; UI.confirm=false; save(); render(); toast('Removed from the rack') }
  if (a==='newproduct'){ UI.confirm=false; UI.view = UI.view==='home'?'products':UI.view; UI.sheet={type:'product', isNew:true, draft:{id:'p'+Date.now(), name:'', cat:'hijabs', img:'img/hijab-petal-pink.webp', price:17, color:'', desc:'', pub:true, stock:true, featured:false}}; render() }
  if (a==='addrack'){ UI.confirm=false; UI.sheet={type:'rack', i:-1, draft:{src:'img/rack-hooded-navy.webp', name:'Navy Hooded Set', slug:'', show:true}}; render() }
  if (a==='savecontent'){
    S.hero = {title:document.getElementById('ht').value, body:document.getElementById('hb').value, cta:document.getElementById('hc').value};
    S.faqs = S.faqs.map((f,i)=>({q:document.querySelector(`[data-fq="${i}"]`).value, a:document.querySelector(`[data-fa="${i}"]`).value}));
    save(); toast('Home page updated');
  }
  if (a==='addfaq'){ S.faqs = S.faqs.map((f,i)=>({q:document.querySelector(`[data-fq="${i}"]`).value, a:document.querySelector(`[data-fa="${i}"]`).value})); S.faqs.push({q:'',a:''}); render(); document.querySelector(`[data-fq="${S.faqs.length-1}"]`)?.focus() }
  if (a==='savedelivery'){ S.cities.forEach((c,i)=>{ c.cost = +document.querySelector(`[data-fee="${i}"]`).value||0; c.on = document.querySelector(`[data-city="${i}"]`).checked }); save(); toast('Delivery fees saved') }
  if (a==='savesettings'){ toast('Settings saved') }
  if (a==='invite'){ toast('Invites arrive by email in the real panel') }
  if (a==='preview'){ toast('Opens the live store in the real panel') }
  if (a==='reset'){ const si = S.signedIn; S = fresh(); S.signedIn = si; save(); go('home'); toast('Preview reset') }
  if (a==='signout'){ S.signedIn=false; save(); UI.view='home'; render() }
});
document.addEventListener('keydown', (e) => { if (e.key==='Escape' && UI.sheet){ UI.sheet=null; UI.confirm=false; render() } });
render();
</script>
