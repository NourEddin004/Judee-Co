; PHP settings for the site. Copy to /etc/php/8.5/fpm/conf.d/99-jude.ini, then:
;   sudo systemctl reload php8.5-fpm
; The command-line PHP keeps Ubuntu's own defaults (no memory limit), which the deploy and the
; queue worker need.

; Photos are resized at full size before they shrink: 256M covers a large phone photo.
memory_limit = 256M

; Admins upload photos of up to 5 MB (config/store.php); nginx allows 6 MB (client_max_body_size).
upload_max_filesize = 6M
post_max_size = 8M

; Saving a product with many new photos resizes them all in one request.
; nginx waits as long (fastcgi_read_timeout 60s in deploy/nginx/jude.conf).
max_execution_time = 60

expose_php = Off
date.timezone = Asia/Amman

; deploy.sh reloads php-fpm after each deploy, so files need not be re-checked on every request.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
