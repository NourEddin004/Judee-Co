# Copy to /etc/nginx/snippets/. Added to every response from the server (REQ-SEC-18), in place of the
# copies the site sends with its pages (app/Http/Middleware/SecurityHeaders.php, which also sends the
# Content Security Policy). Locally, without nginx, the site's own copies apply.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
