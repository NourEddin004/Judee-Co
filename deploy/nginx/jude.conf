# JUDE Boutique. Replace example.com and the certificate paths when the domain is approved.
# Works with Ubuntu 24.04's own nginx (1.24). Needs the two snippets next to this file copied to
# /etc/nginx/snippets/ (see deploy/HOSTING-CHECKLIST.md).
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://example.com$request_uri;   # REQ-SEC-09
}

# www goes to the main address over HTTPS too. The origin certificate must cover both names.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.example.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;
    root /var/www/jude/current/public;
    index index.php;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    # The visitor's own address, not Cloudflare's: the per-visitor limits (5 orders an hour,
    # 60 requests a minute, sign-in tries) depend on it.
    include snippets/cloudflare-real-ip.conf;

    client_max_body_size 6m;   # uploads are 5 MB at most (REQ-SEC-19)
    charset utf-8;

    # Compressed text files: less traffic from the server to Cloudflare (REQ-CST-04).
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    # Security headers (REQ-SEC-18) on everything this server answers: files, pages, and nginx's own
    # error pages (a refused hidden file, an upload that is too large, the site being down). The site's
    # Content Security Policy comes from the site itself (REQ-SEC-17).
    include snippets/jude-security-headers.conf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Built assets and fonts carry a content hash: cache for a year. A location with its own
    # add_header loses the server's, so the security headers are included again.
    location ~* ^/(build|fonts)/ {
        include snippets/jude-security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        access_log off;
    }

    # Uploaded images are served as files only; nothing there can run (REQ-SEC-20).
    location ^~ /storage/ {
        location ~ \.php$ { return 404; }
        expires 30d;
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # The site sends these too; nginx's copies (above) replace them, so each is sent once.
        fastcgi_hide_header Strict-Transport-Security;
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header Referrer-Policy;
        fastcgi_read_timeout 60s;   # matches max_execution_time in deploy/php/jude.ini
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
